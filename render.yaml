# Render Blueprint — deploys the backend + a PostgreSQL database.
# In Render: New → Blueprint → pick this repo. Then set the two values marked
# "sync: false" (ADMIN_PASSWORD and DEVICE_API_KEY) in the dashboard.
#
# Notes:
# - The web service lives in the backend/ subfolder (rootDir).
# - DATABASE_URL is wired to the managed database; the app normalizes the
#   postgresql:// URL to the async driver automatically.
# - Render free Postgres is removed ~30 days after creation. For a longer pilot,
#   point DATABASE_URL at a non-expiring free Postgres (Neon / Supabase) instead.

services:
  - type: web
    name: library-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: DEVICE_API_KEY
        sync: false                  # set the SAME value in the counter's .env
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                  # set a strong password in the dashboard
      - key: ALLOWED_ORIGINS
        value: https://bits-library.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString

databases:
  - name: library-db
    plan: free
    region: singapore
